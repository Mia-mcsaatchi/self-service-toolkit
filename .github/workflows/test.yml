name: Tests

# Runs on every pull request and on pushes to main. No secrets needed: the
# test suite mocks Claude, OpenAI and Supabase.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # matches the Dockerfile
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Backend tests
        run: pytest -q

      - name: Frontend script parses
        run: |
          python3 - <<'PY'
          import re
          html = open("index.html", encoding="utf-8").read()
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          open("/tmp/app.js", "w", encoding="utf-8").write(max(scripts, key=len))
          PY
          node --check /tmp/app.js
